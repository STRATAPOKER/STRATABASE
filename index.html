<script>
'use strict';
// Чистые функции поиска используются также в изолированных проверках.
function canonical(value) {
  return String(value ?? '').replace(/[№#](?=\s*\d)/g,' ').toLowerCase().normalize('NFKC').replace(/ё/g,'е')
    .replace(/[_\u2010-\u2015]/g,' ')
    .replace(/(?<![a-zа-я])(?:бб|вв|bв|вb)(?=vs|versus|[^a-zа-я]|$)/g,'bb')
    .replace(/(?<![a-zа-я])сб(?=vs|versus|[^a-zа-я]|$)/g,'sb')
    .replace(/больш(?:ой|ого|ом|ому)\s+блайнд[а-я]*/g,'bb')
    .replace(/мал(?:ый|ого|ом|ому)\s+блайнд[а-я]*/g,'sb')
    .replace(/(?:btn|button|баттон[а-я]*|батон[а-я]*|бу)(?=\s*(?:vs\.?|versus|против)|[^a-zа-я]|$)/g,'bu')
    .replace(/(?<![a-zа-я0-9])([34])\s*[- ]?\s*(?:bet|бет)[а-я]*\s*[- ]?\s*(?:банк[а-я]*|пот[а-я]*|pots?)(?![a-zа-я])/g,'$1bp')
    .replace(/(?<![a-zа-я])(?:анте|ante)(?![a-zа-я])/g,'ante')
    .replace(/глубок[а-я]*\s+ст[еэ]к[а-я]*|deep\s*[- ]?\s*stacks?|дип\s*ст[еэ]к[а-я]*|(?<![a-z])deep(?![a-z])/g,'deepstack')
    .replace(/(?<![a-zа-я])(?:strad{1,2}l[ea]?s?|страд{1,2}л[а-я]*|стр[еэ]д{1,2}л[а-я]*)(?![a-zа-я])/g,'straddle')
    .replace(/(?:защит[а-я]*|defen[cs]e|defend)\s+(?:на\s+)?bb(?![a-z])/g,'bbdefense')
    .replace(/bb\s+(?:defen[cs]e|defend)(?![a-z])/g,'bbdefense');
}
function normalize(value) {
  return canonical(value)
    .replace(/(utg\+1|utg|ep|mp|hj|co|bu|bb|sb)\s*(?:versus|vs\.?|против)\s*(utg\+1|utg|ep|mp|hj|co|bu|bb|sb)/g,'$1 vs $2')
    .replace(/[^a-zа-я0-9+&]+/g,' ').trim().replace(/\s+/g,' ');
}
function queryParts(query) {
  const p='(?:utg\\+1|utg|bu|bb|sb|ep|mp|hj|co)';
  const parts=new RegExp('"[^"]*"|«[^»]*»|'+p+'\\s*(?:versus|vs\\.?|против)\\s*'+p+'|\\S+','gi');
  const ignored=new Set(['игра','игры','играть','игре','в','во','на','по','с','со','за','как']);
  return (canonical(query).match(parts)||[]).map(normalize).filter(s=>s&&!ignored.has(s));
}
function searchText(t) {
  const defense=t.tags.some(tag=>/^BB vs /.test(tag))?'bbdefense':'';
  return normalize([t.number,t.file,t.title,t.trainer,t.date,t.date.replaceAll('-',''),t.date.split('-').reverse().join('.'),...t.tags,defense].join(' '));
}
const collections=[
  {id:'bots',title:'Разбор ботов'},
  {id:'fish',title:'Игра против фишей'},
  {id:'fast',title:'Быстрый покер'},
  {id:'bomb',title:'Бомб-поты'}
];
function collectionIds(t){
  const file=t.file.toLowerCase(),title=t.title.toLowerCase();
  const ids=[];
  if(/bot_ai_p\d+/.test(file)||/разбор ботов ии/.test(title)&&/часть\s*\d+/.test(title))ids.push('bots');
  if(/_fish_\d+/.test(file)||/игра против фишей/.test(title)&&/часть\s*\d+/.test(title))ids.push('fish');
  if(/быстрый покер["»]?,\s*часть\s*\d+/i.test(title))ids.push('fast');
  if(t.tags.includes('Бомб-поты')&&/база\s*;\s*часть\s*\d+/.test(title))ids.push('bomb');
  return ids;
}
function selectTrainings(records,state) {
  const terms=queryParts(state.query);
  return records.filter(t=>{
    if(state.collection&&!collectionIds(t).includes(state.collection))return false;
    if(!terms.every(term=>t.search.includes(term)))return false;
    return Object.values(state.selected).every(tags=>tags.size===0 || [...tags].some(tag=>t.tags.includes(tag)));
  }).sort((a,b)=>{
    switch(state.sort){case 'oldest':return a.date.localeCompare(b.date)||a.number-b.number;case 'shortest':return a.minutes-b.minutes||b.date.localeCompare(a.date)||b.number-a.number;case 'longest':return b.minutes-a.minutes||b.date.localeCompare(a.date)||b.number-a.number;case 'number':return a.number-b.number;default:return b.date.localeCompare(a.date)||b.number-a.number;}
  });
}
// INTERFACE
const catalog=JSON.parse(document.getElementById('catalog-data').textContent);
const records=catalog.trainings.map(t=>({...t,search:searchText(t)}));
const groups=catalog.groups;
const $=id=>document.getElementById(id);
const state={query:'',sort:'newest',collection:'',selected:Object.fromEntries(groups.map(g=>[g.id,new Set()]))};
const pageSize=24;
let shown=pageSize,filtered=[],searchTimer;
const tagGroup=new Map(groups.flatMap(g=>g.tags.map(tag=>[tag,g.id])));
const checks=[];const courseButtons=[],quickButtons=[];
function element(tag,className,text){const el=document.createElement(tag);if(className)el.className=className;if(text!==undefined)el.textContent=text;return el;}
function formatDate(date){return date.split('-').reverse().join('.');}
function formatMinutes(minutes){const h=Math.floor(minutes/60),m=minutes%60;return h?(m?`${h} ч ${m} мин`:`${h} ч`):`${m} мин`;}
const totalHours=Math.floor(records.reduce((n,t)=>n+t.minutes,0)/60);
const motion=window.matchMedia('(prefers-reduced-motion: reduce)');
let countFrame=0;
function showTotals(progress){$('total').textContent=Math.round(records.length*progress).toLocaleString('ru-RU');$('hours').textContent=Math.round(totalHours*progress).toLocaleString('ru-RU');}
$('total').setAttribute('aria-label',String(records.length));$('hours').setAttribute('aria-label',String(totalHours));
if(motion.matches)showTotals(1);else{const start=performance.now();const tick=now=>{const p=Math.min(1,(now-start)/1250);showTotals(1-Math.pow(1-p,3));if(p<1)countFrame=requestAnimationFrame(tick);};countFrame=requestAnimationFrame(tick);}
motion.addEventListener('change',()=>{if(motion.matches){cancelAnimationFrame(countFrame);showTotals(1);}});
function lessons(n){return n%100>=11&&n%100<=14?'уроков':n%10===1?'урок':n%10>=2&&n%10<=4?'урока':'уроков';}
collections.forEach((collection,i)=>{
  const count=records.filter(t=>collectionIds(t).includes(collection.id)).length;
  if(!count)return;
  const button=element('button','collection-card');button.setAttribute('aria-pressed','false');
  button.append(element('span','collection-index',String(i+1).padStart(2,'0')),element('span','collection-title',collection.title));
  const bottom=element('span','collection-bottom');bottom.append(element('span',null,count+' '+lessons(count)),element('span','collection-arrow','↗'));button.append(bottom);
  button.addEventListener('click',()=>{state.collection=state.collection===collection.id?'':collection.id;refresh();});
  courseButtons.push({button,id:collection.id});$('collections').append(button);
});
['Глубокие стеки','Анте','Страддл'].forEach(tag=>{
  const button=element('button','quick-topic',tag);button.setAttribute('aria-pressed','false');
  button.addEventListener('click',()=>{state.selected.topic.has(tag)?state.selected.topic.delete(tag):state.selected.topic.add(tag);refresh();});
  quickButtons.push({button,tag});$('quick-topics').append(button);
});
const sortOptions=[['newest','Сначала новые'],['oldest','Сначала старые'],['shortest','Сначала короткие'],['longest','Сначала длинные'],['number','По номеру в базе']];
let sortActive=0;
function syncSort(){
  $('sort-value').textContent=sortOptions.find(o=>o[0]===state.sort)[1];
  [...$('sort-options').children].forEach((el,i)=>{el.setAttribute('aria-selected',String(sortOptions[i][0]===state.sort));el.classList.toggle('active',i===sortActive);});
}
function closeSort(){ $('sort-options').hidden=true;$('sort').setAttribute('aria-expanded','false');$('sort').removeAttribute('aria-activedescendant'); }
function openSort(){sortActive=sortOptions.findIndex(o=>o[0]===state.sort);$('sort-options').hidden=false;$('sort').setAttribute('aria-expanded','true');activateSort(sortActive);}
function activateSort(index){sortActive=(index+sortOptions.length)%sortOptions.length;syncSort();$('sort').setAttribute('aria-activedescendant','sort-option-'+sortActive);}
function chooseSort(index){state.sort=sortOptions[index][0];closeSort();refresh();$('sort').focus();}
sortOptions.forEach(([value,label],i)=>{const button=element('button','sort-option',label);button.id='sort-option-'+i;button.setAttribute('role','option');button.tabIndex=-1;button.setAttribute('aria-selected',String(value===state.sort));button.addEventListener('click',()=>chooseSort(i));$('sort-options').append(button);});
$('sort').addEventListener('click',()=>{$('sort-options').hidden?openSort():closeSort();});
$('sort').addEventListener('keydown',event=>{
 const opened=!$('sort-options').hidden;
 if(['ArrowDown','ArrowUp','Home','End'].includes(event.key)){event.preventDefault();if(!opened)openSort();else if(event.key==='ArrowDown')activateSort(sortActive+1);else if(event.key==='ArrowUp')activateSort(sortActive-1);if(event.key==='Home')activateSort(0);if(event.key==='End')activateSort(sortOptions.length-1);}
 else if(event.key==='Enter'||event.key===' '){event.preventDefault();opened?chooseSort(sortActive):openSort();}
 else if(event.key==='Escape'){event.preventDefault();closeSort();}
 else if(event.key==='Tab')closeSort();
});
document.addEventListener('click',event=>{if(!$('sort-picker').contains(event.target))closeSort();});
document.addEventListener('focusin',event=>{if(!$('sort-picker').contains(event.target))closeSort();});

groups.forEach(group=>{
  const box=element('details','filter-box'),summary=element('summary',null,group.label),count=element('span','group-count');
  count.id='count-'+group.id;summary.append(count);box.append(summary);
  const chips=element('div','chips');chips.setAttribute('role','group');chips.setAttribute('aria-label',group.label);
  group.tags.forEach(tag=>{
    const label=element('label','chip'),input=element('input');input.type='checkbox';input.value=tag;
    const total=records.filter(t=>t.tags.includes(tag)).length;
    const counter=element('small',null,total);counter.title='Тренировок с этим тегом во всей базе';counter.setAttribute('aria-label',`${total} тренировок во всей базе`);
    input.addEventListener('change',()=>{input.checked?state.selected[group.id].add(tag):state.selected[group.id].delete(tag);refresh();});
    label.append(input,element('span',null,tag),counter);chips.append(label);checks.push({input,tag,group:group.id});
  });box.append(chips);
  $('filters').append(box);
});
function buildCard(t,index){
  const card=element('article','training');card.style.animationDelay=`${Math.min(index%pageSize,7)*18}ms`;
  const body=element('div','card-body'),top=element('div','card-top');
  const date=element('time','card-date',formatDate(t.date));date.dateTime=t.date;top.append(element('span','number',`№ ${t.number}`),date);body.append(top);
  const topics=t.title.split(';').map(s=>s.trim()).filter(Boolean);
  body.append(element('h3','card-title',topics[0]||t.file));
  if(topics.length>1){const list=element('ul','topics');topics.slice(1).forEach(s=>list.append(element('li',null,s)));body.append(list);}
  const meta=element('div','meta');meta.append(element('span','trainer',t.trainer),element('span',null,formatMinutes(t.minutes)));body.append(meta);
  const badges=element('div','badges');t.tags.forEach(tag=>badges.append(element('span','badge '+(tagGroup.get(tag)||''),tag)));if(t.tags.length)body.append(badges);
  const source=element('details','source');source.append(element('summary',null,'Название файла'),element('code',null,t.file));body.append(source);card.append(body);
  const bottom=element('div','card-bottom');bottom.append(element('span','access-note','Для подписчиков STRATA'));
  if(/^https:\/\/t\.me\/[A-Za-z0-9_/?=&%+.#-]+$/.test(t.link)){
    const link=element('a','button primary');const arrow=element('span','button-arrow','↗');arrow.setAttribute('aria-hidden','true');link.append(element('span',null,'Смотреть запись'),arrow);link.href=t.link;link.target='_blank';link.rel='noopener noreferrer';link.setAttribute('aria-label',`Смотреть тренировку №${t.number} в Telegram`);bottom.append(link);
  }else bottom.append(element('span','no-link','Ссылка пока не добавлена'));
  card.append(bottom);return card;
}
function renderCards(append=false){
  const start=append?Math.max(0,shown-pageSize):0,fragment=document.createDocumentFragment();
  filtered.slice(start,shown).forEach((t,i)=>fragment.append(buildCard(t,i)));
  if(!append)$('trainings').replaceChildren();$('trainings').append(fragment);
  $('empty').hidden=filtered.length>0;$('trainings').hidden=filtered.length===0;
  $('load-more').hidden=shown>=filtered.length;
  $('load-more').textContent=`Показать ещё ${Math.min(pageSize,Math.max(0,filtered.length-shown))}`;
  $('result-status').textContent=`Найдено ${filtered.length} из ${records.length} · Показано ${Math.min(shown,filtered.length)}`;
}
function refresh(){
  clearTimeout(searchTimer);state.query=$('search').value;shown=pageSize;
  filtered=selectTrainings(records,state);
  checks.forEach(c=>c.input.checked=state.selected[c.group].has(c.tag));
  groups.forEach(g=>$('count-'+g.id).textContent=state.selected[g.id].size||'');
  $('selected').replaceChildren();
  groups.forEach(g=>state.selected[g.id].forEach(tag=>{
    const b=element('button','selected-tag',tag);b.append(element('span',null,'×'));b.setAttribute('aria-label',`Убрать фильтр ${tag}`);
    b.addEventListener('click',()=>{state.selected[g.id].delete(tag);refresh();checks.find(c=>c.tag===tag)?.input.focus();});$('selected').append(b);
  }));
  if(state.collection){const course=collections.find(c=>c.id===state.collection);const b=element('button','selected-tag','Курс: '+course.title);b.append(element('span',null,'×'));b.setAttribute('aria-label','Убрать курс '+course.title);b.addEventListener('click',()=>{state.collection='';refresh();courseButtons.find(c=>c.id===course.id)?.button.focus();});$('selected').prepend(b);}
  courseButtons.forEach(c=>c.button.setAttribute('aria-pressed',String(c.id===state.collection)));
  quickButtons.forEach(c=>c.button.setAttribute('aria-pressed',String(state.selected.topic.has(c.tag))));
  $('selected').hidden=!state.collection&&!Object.values(state.selected).some(s=>s.size);
  syncSort();
  $('clear-search').hidden=!state.query;
  $('reset').disabled=!state.query&&state.sort==='newest'&&$('selected').hidden;
  renderCards();
}
function reset(){
  $('search').value='';state.query='';state.sort='newest';state.collection='';closeSort();Object.values(state.selected).forEach(s=>s.clear());
  refresh();$('search').focus();
}
$('search').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(refresh,120);});
$('clear-search').addEventListener('click',()=>{$('search').value='';refresh();$('search').focus();});

$('reset').addEventListener('click',reset);$('empty-reset').addEventListener('click',reset);
$('load-more').addEventListener('click',()=>{const oldCount=$('trainings').children.length;shown+=pageSize;renderCards(true);const next=$('trainings').children[oldCount];if(next){next.tabIndex=-1;next.focus({preventScroll:true});}});
refresh();
</script>
</body>
</html>
